{% extends "base.html" %}

{% block title %}Редактирование цели{% endblock %}

{% block content %}
<div class="container mt-4 fade-in">
    <div class="page-header">
        <h1><i class="fas fa-edit me-2"></i>Редактирование цели</h1>
        <p class="mb-0">Изменение данных цели накопления</p>
    </div>

    <div class="card form-card">
        <div class="card-header">
            <h5 class="mb-0">Данные цели</h5>
        </div>

        <div class="card-body">
            <form action="{{ url_for('edit_goal', goal_id=goal.id) }}" method="post">
                <div class="mb-3">
                    <label class="form-label">Название цели</label>
                    <input type="text" class="form-control" name="name" value="{{ goal.name }}" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Целевая сумма</label>
                    <input type="number" class="form-control" name="target_amount"
                           step="100" min="1" value="{{ goal.target_amount }}" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Текущая сумма</label>
                    <input type="number" class="form-control" name="current_amount"
                           step="100" min="0" value="{{ goal.current_amount }}" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Срок</label>
                    <input type="date" class="form-control" name="deadline" value="{{ goal.deadline or '' }}">
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-modern-success">
                        <i class="fas fa-save me-1"></i>Сохранить
                    </button>

                    <a href="{{ url_for('view_goals') }}" class="btn btn-secondary">
                        Назад
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
