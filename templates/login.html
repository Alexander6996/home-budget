{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center" style="min-height: 60vh;">
    <div class="col-md-5">
        <div class="card shadow">
            <div class="card-header text-center" style="background: linear-gradient(135deg, #2c3e50, #34495e);">
                <h4 class="mb-0 text-white">
                    <i class="fas fa-sign-in-alt me-2"></i>Вход в систему
                </h4>
            </div>
            <div class="card-body p-4">
                <form method="POST" autocomplete="off">
                    <div class="mb-3">
                        <label class="form-label">Имя пользователя</label>
                        <input type="text" class="form-control form-control-lg"
                               name="username" required
                               id="login-username"
                               autocomplete="new-username">
                    </div>

                    <div class="mb-4">
                        <label class="form-label">Пароль</label>
                        <div class="input-group">
                            <input type="password" class="form-control form-control-lg"
                                   id="login-password" name="password" required
                                   autocomplete="new-password">
                            <button type="button" class="btn btn-outline-secondary" onclick="togglePassword('login-password', this)">👁</button>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary btn-lg w-100 mb-3">Войти</button>
                    <div class="text-center">
                        <p class="mb-0">Нет аккаунта?
                            <a href="{{ url_for('register') }}" class="text-decoration-none">
                                <strong>Зарегистрироваться</strong>
                            </a>
                        </p>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
function togglePassword(id, btn) {
    const input = document.getElementById(id);
    if (input.type === "password") {
        input.type = "text";
        btn.textContent = "🙈";
    } else {
        input.type = "password";
        btn.textContent = "👁";
    }
}

// Очистка полей при загрузке страницы
document.addEventListener('DOMContentLoaded', function() {
    document.getElementById('login-username').value = '';
    document.getElementById('login-password').value = '';

    // Фокус на поле username
    document.getElementById('login-username').focus();
});
</script>
{% endblock %}
